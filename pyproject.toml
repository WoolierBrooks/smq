[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smq"
version = "1.0.0"
description = "SMQ: Synthetic Score Meta-Learning for Multiclass Quantification (IBERAMIA 2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Julio Cesar Riveros Cardus", email = "julio.cardus@unioeste.br" },
  { name = "André Gustavo Maletzke" },
  { name = "Willian Zalewski" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]
keywords = ["quantification", "prevalence estimation", "meta-learning", "label shift", "synthetic data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
experiments = ["pandas>=2.0", "tqdm", "quapy>=0.1.8", "mlquantify>=0.1.11"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7", "pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/WoolierBrooks/smq"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
